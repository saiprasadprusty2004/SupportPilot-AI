[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supportpilot"
version = "0.1.0"
description = "Durable, approval-driven support automation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.38,<2.1",
  "alembic>=1.15,<2", "psycopg[binary,pool]>=3.2,<4", "pgvector>=0.3,<1",
  "redis>=5.2,<7", "celery>=5.5,<6", "pydantic-settings>=2.8,<3",
  "argon2-cffi>=23.1,<26", "cryptography>=44,<47", "httpx>=0.28,<1",
  "python-multipart>=0.0.20", "email-validator>=2.2,<3", "itsdangerous>=2.2,<3",
  "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4",
  "langgraph-checkpoint-sqlite>=3,<4", "pypdf>=5.3,<7", "python-docx>=1.1,<2",
  "prometheus-client>=0.21,<1", "authlib>=1.5,<2", "boto3>=1.37,<2"
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.4,<6"]
test = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires PostgreSQL with pgvector", "live: requires real provider credentials"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
